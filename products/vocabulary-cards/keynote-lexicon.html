<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #F5F2EA;
    --surface: #FFFFFF;
    --surface-2: #EEE9DC;
    --ink: #1E1B14;
    --muted: #706A5B;
    --line: #DEd6c2;
    --accent: #B85A22;
    --accent-ink: #FFF8EF;
    --accent-soft: #EFD9BC;
    --card-shadow: 0 1px 2px rgba(30,27,20,0.06), 0 8px 20px -12px rgba(30,27,20,0.18);
    --jh: #B85A22;
    --em: #3B6E8F;
    --sa: #5C7A5A;
    --sp: #6B5B95;
    --mz: #4A5D8A;
    --good: #4A7A4E;
    --bad: #B5482F;
    --rare-a: #8FB3D6;
    --rare-b: #E4EEF5;
    --rare-fg: #2E5A7A;
    --legend-a: #E8B34A;
    --legend-b: #F7E4B0;
    --legend-fg: #7A5417;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #16140F;
      --surface: #201C15;
      --surface-2: #29241B;
      --ink: #F2EEE2;
      --muted: #A79C87;
      --line: #3A3427;
      --accent: #E8873A;
      --accent-ink: #1B1204;
      --accent-soft: #4A3620;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -14px rgba(0,0,0,0.6);
      --jh: #E8873A;
      --em: #7EB4DC;
      --sa: #8FBB8A;
      --sp: #A996D8;
      --mz: #8FA6E0;
      --good: #7FBF83;
      --bad: #E27A5F;
      --rare-a: #4A7396;
      --rare-b: #25333F;
      --rare-fg: #BFE0F5;
      --legend-a: #C98A2E;
      --legend-b: #4A3620;
      --legend-fg: #F5DFA6;
    }
  }
  :root[data-theme="dark"]{
    --bg: #16140F;
    --surface: #201C15;
    --surface-2: #29241B;
    --ink: #F2EEE2;
    --muted: #A79C87;
    --line: #3A3427;
    --accent: #E8873A;
    --accent-ink: #1B1204;
    --accent-soft: #4A3620;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -14px rgba(0,0,0,0.6);
    --jh: #E8873A;
    --em: #7EB4DC;
    --sa: #8FBB8A;
    --sp: #A996D8;
    --mz: #8FA6E0;
    --good: #7FBF83;
    --bad: #E27A5F;
    --rare-a: #4A7396;
    --rare-b: #25333F;
    --rare-fg: #BFE0F5;
    --legend-a: #C98A2E;
    --legend-b: #4A3620;
    --legend-fg: #F5DFA6;
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    padding: 22px 16px 56px;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; }

  .mono{ font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }

  header{
    display: flex; flex-wrap: wrap; gap: 16px 32px;
    align-items: flex-end; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .titleblock h1{
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(24px, 4vw, 36px);
    line-height: 1.05;
    margin: 0 0 6px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .titleblock p{
    margin: 0; color: var(--muted); font-size: 14px; max-width: 52ch; line-height: 1.5;
  }
  .stats{
    display: flex; gap: 18px; font-size: 12.5px; color: var(--muted);
    white-space: nowrap;
  }
  .stats b{ color: var(--ink); font-weight: 600; }

  .toolbar{
    display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 20px;
  }
  .mode-toggle{ display: flex; gap: 6px; }
  .mode-toggle button{
    font-family: "Public Sans", sans-serif; font-weight: 600; font-size: 13.5px;
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .mode-toggle button.active{ background: var(--ink); color: var(--bg); border-color: var(--ink); }

  #filters{ display: flex; flex-direction: column; gap: 10px; }
  .filter-row{ display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filter-row .label{
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); width: 64px; flex: none;
  }
  .chip{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none; transition: border-color .15s, color .15s, background .15s;
    line-height: 1.2;
  }
  .chip:hover{ border-color: var(--accent); color: var(--ink); }
  .chip.active{
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .chip .dot{ display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* ---- Shared flip-card mechanics ---- */
  .flashcard{ perspective: 1200px; height: 230px; cursor: pointer; position: relative; }
  .flashcard-inner{
    position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{ transform: rotateY(180deg); }
  .face{
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
    box-shadow: var(--card-shadow); padding: 16px; display: flex; flex-direction: column;
    overflow-y: auto; overflow-x: hidden;
  }
  .face.back{ transform: rotateY(180deg); background: var(--surface-2); }

  .face-top{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cat-tag{
    font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--accent); font-weight: 600;
  }
  .term-zh{ font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .face.front .term-en{
    font-family: "Fraunces", Georgia, serif; font-size: 25px; font-weight: 500;
    line-height: 1.12; margin-top: auto; margin-bottom: auto; text-wrap: balance;
  }
  .speaker-row{
    display: flex; align-items: center; gap: 7px; margin-top: auto; padding-top: 8px;
    font-size: 11.5px; color: var(--muted); font-family: "IBM Plex Mono", monospace;
  }
  .speaker-dot{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hint{ position: absolute; bottom: 10px; right: 14px; font-size: 10px; color: var(--muted); opacity: .55; font-family: "IBM Plex Mono",monospace;}

  .face.back .def-en{ font-size: 13.5px; line-height: 1.45; margin: 2px 0 6px; }
  .face.back .def-zh{ font-size: 13px; line-height: 1.45; color: var(--muted); margin-bottom: 8px; }
  blockquote.quote{
    margin: auto 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line);
    font-size: 12px; line-height: 1.4; font-style: italic; color: var(--ink);
  }
  blockquote.quote cite{
    display: block; margin-top: 4px; font-style: normal; font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px; color: var(--muted);
  }
  .special-badge{
    position: absolute; top: 10px; right: 10px; z-index: 2; font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent);
    background: var(--accent-soft); padding: 2px 7px; border-radius: 999px;
  }

  /* ---- Extended (3rd) face: source & context ---- */
  .ext-block{ display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .ext-row{ font-size: 12.5px; color: var(--ink); display: flex; gap: 8px; }
  .ext-label{
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    width: 40px; flex: none; padding-top: 2px;
  }
  .ext-context{
    margin: 10px 0 0; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 12.5px; line-height: 1.55; color: var(--ink);
  }

  /* ---- Rarity: badges + foil borders (Pokemon-pack style) ---- */
  .rarity-badge{
    font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
  }
  .rarity-badge.common{ color: var(--muted); background: var(--surface-2); }
  .rarity-badge.rare{ color: var(--rare-fg); background: linear-gradient(120deg, var(--rare-a), var(--rare-b)); }
  .rarity-badge.legendary{ color: var(--legend-fg); background: linear-gradient(120deg, var(--legend-a), var(--legend-b)); }

  .flashcard.rarity-rare .face{
    border: 1.5px solid transparent;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(120deg, var(--rare-a), var(--rare-b), var(--rare-a)) border-box;
  }
  .flashcard.rarity-rare .face.back{
    background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
                linear-gradient(120deg, var(--rare-a), var(--rare-b), var(--rare-a)) border-box;
  }
  .flashcard.rarity-legendary .face{
    border: 1.5px solid transparent;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(120deg, var(--legend-a), var(--legend-b), var(--legend-a)) border-box;
  }
  .flashcard.rarity-legendary .face.back{
    background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
                linear-gradient(120deg, var(--legend-a), var(--legend-b), var(--legend-a)) border-box;
  }

  /* ---- Pack-opening cover (daily challenge only) ---- */
  .pack-cover{
    position: absolute; inset: 0; z-index: 5; border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #26221A, #050403 140%);
    color: #F5F1E6; cursor: pointer;
    transition: transform .5s cubic-bezier(.4,.2,.2,1), opacity .5s ease;
  }
  .pack-cover::before{
    content: ""; position: absolute; inset: -60%;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 10px, transparent 10px 22px);
  }
  .pack-cover .pack-mark{ font-family: "Fraunces", serif; font-size: 24px; letter-spacing: .03em; z-index: 1; }
  .pack-cover .pack-hint{ font-size: 10.5px; opacity: .7; z-index: 1; }
  .flashcard.rarity-rare .pack-cover{ box-shadow: inset 0 0 0 2px var(--rare-a); }
  .flashcard.rarity-legendary .pack-cover{ box-shadow: inset 0 0 0 2px var(--legend-a); }
  .flashcard.rarity-legendary .pack-cover::after{
    content: "✦"; position: absolute; top: 10px; right: 14px; color: var(--legend-a); font-size: 13px; z-index: 1;
  }
  .pack-cover.opening{ transform: rotateY(180deg) scale(1.05); opacity: 0; pointer-events: none; }

  .reveal-burst{
    position: absolute; inset: 0; border-radius: 14px; pointer-events: none; z-index: 6;
    background: radial-gradient(circle at 50% 42%, rgba(232,179,74,0.6), transparent 62%);
    animation: burst-pop .8s ease-out forwards;
  }
  @keyframes burst-pop{
    0%{ opacity: 0; transform: scale(.6); }
    30%{ opacity: 1; }
    100%{ opacity: 0; transform: scale(1.7); }
  }

  /* ---- Feed (swipe) mode — the default, social-friendly view ---- */
  #feed-panel{ display: none; flex-direction: column; align-items: center; gap: 10px; }
  #feed-panel.active{ display: flex; }
  .feed-progress{
    width: 100%; max-width: 420px; height: 4px; border-radius: 999px; background: var(--surface-2);
    overflow: hidden;
  }
  .feed-progress > div{ height: 100%; background: var(--accent); transition: width .2s; width: 5%; }
  .feed-scroll{
    width: 100%; max-width: 420px; height: min(640px, 74vh);
    overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
    border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2);
    scrollbar-width: none;
  }
  .feed-scroll::-webkit-scrollbar{ display: none; }
  .feed-slide{
    scroll-snap-align: start; scroll-snap-stop: always;
    height: 100%; min-height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; padding: 30px 22px;
  }
  .feed-counter{ position: absolute; top: 16px; left: 20px; font-size: 11px; color: var(--muted); }
  .feed-hint{ position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); opacity: .6; }
  .feed-card-wrap{ perspective: 1400px; width: 100%; height: 76%; }
  .feed-card-wrap .flashcard{ width: 100%; height: 100%; }
  .feed-card-wrap .face{ padding: 26px; border-radius: 18px; }
  .feed-card-wrap .face.front .term-en{ font-size: 28px; text-align: center; }
  .feed-card-wrap .cat-tag{ text-align: center; }
  .feed-card-wrap .term-zh{ text-align: center; }
  .feed-card-wrap .speaker-row{ justify-content: center; }
  .feed-card-wrap .hint{ display: none; }
  .share-btn{
    position: absolute; bottom: 46px; right: 20px;
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .share-btn:hover{ border-color: var(--accent); color: var(--accent); }

  .toast{
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(14px);
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 50;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- Daily challenge (pack-opening + streak calendar) ---- */
  #daily-panel{ display: none; flex-direction: column; align-items: center; gap: 10px; }
  #daily-panel.active{ display: flex; }
  .daily-top{ width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; }
  .streak{ font-size: 13px; color: var(--muted); }
  .streak b{ color: var(--accent); font-size: 15px; }
  .cal-toggle{
    font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .cal-toggle:hover{ border-color: var(--accent); color: var(--accent); }
  #calendar-wrap{
    width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  .cal-header{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-header button{ background: none; border: none; font-size: 16px; color: var(--muted); cursor: pointer; padding: 2px 10px; }
  .cal-header button:hover{ color: var(--accent); }
  #cal-month-label{ font-size: 12.5px; color: var(--ink); }
  .cal-grid{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow{ font-size: 10px; text-align: center; color: var(--muted); }
  .cal-cell{
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", monospace;
  }
  .cal-cell.done{ background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .cal-cell.today{ box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-cell.empty{ visibility: hidden; }
  .daily-progress-row{
    width: 100%; max-width: 420px; display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--muted);
  }
  .daily-complete{
    width: 100%; max-width: 420px; text-align: center; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px; padding: 26px 20px;
  }
  .daily-complete-emoji{ font-size: 30px; margin-bottom: 6px; }
  .daily-complete h3{ font-family: "Fraunces", serif; font-size: 21px; margin: 0 0 6px; }
  .daily-complete p{ color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .daily-complete button{
    font-family: "Public Sans"; font-weight: 700; padding: 10px 20px; border-radius: 10px;
    border: none; background: var(--ink); color: var(--bg); cursor: pointer; font-size: 13.5px;
  }

  /* ---- Browse grid ---- */
  #browse-grid{ display: none; }
  #browse-grid.active{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  /* ---- Quiz mode ---- */
  #quiz-panel{ display: none; }
  #quiz-panel.active{ display: flex; }
  #quiz-panel{ flex-direction: column; align-items: center; gap: 18px; }
  .quiz-progress{
    width: 100%; max-width: 480px; height: 6px; border-radius: 999px; background: var(--surface-2);
    overflow: hidden;
  }
  .quiz-progress > div{ height: 100%; background: var(--accent); transition: width .3s; }
  .quiz-counter{ font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); }
  .quiz-card-wrap{ perspective: 1400px; width: 100%; max-width: 480px; height: 300px; }
  .quiz-card-wrap .flashcard{ width: 100%; height: 100%; }
  .quiz-card-wrap .face{ padding: 26px; border-radius: 18px; }
  .quiz-card-wrap .face.front .term-en{ font-size: 32px; text-align: center; }
  .quiz-card-wrap .cat-tag{ text-align: center; }
  .quiz-card-wrap .term-zh{ text-align: center; }
  .quiz-card-wrap .speaker-row{ justify-content: center; }
  .quiz-actions{ display: flex; gap: 10px; }
  .quiz-actions button{
    font-family: "Public Sans", sans-serif; font-weight: 600; font-size: 14px;
    padding: 11px 22px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer;
    background: var(--surface); color: var(--ink);
  }
  .quiz-actions button.know{ border-color: var(--good); color: var(--good); }
  .quiz-actions button.know:hover{ background: var(--good); color: var(--accent-ink); }
  .quiz-actions button.dontknow{ border-color: var(--bad); color: var(--bad); }
  .quiz-actions button.dontknow:hover{ background: var(--bad); color: var(--accent-ink); }
  .quiz-hint{ font-size: 12px; color: var(--muted); }
  .quiz-done{ text-align: center; padding: 30px 0; }
  .quiz-done h2{ font-family: "Fraunces", serif; font-size: 26px; margin: 0 0 8px; }
  .quiz-done p{ color: var(--muted); margin: 0 0 18px; }
  .quiz-done button{
    font-family: "Public Sans"; font-weight: 700; padding: 11px 24px; border-radius: 10px;
    border: none; background: var(--ink); color: var(--bg); cursor: pointer; font-size: 14px;
  }

  footer{ margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }
  footer a{ color: var(--muted); }

  @media (prefers-reduced-motion: reduce){
    .flashcard-inner{ transition: none; }
  }
</style>

<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>Keynote Lexicon</h1>
      <p>從 Jensen Huang、Elon Musk、Sam Altman 等人 2024–2026 年的 30 場演講與訪談中萃取的雙語詞彙卡與語錄，上滑瀏覽、連續點卡片三次看解釋與出處。</p>
    </div>
    <div class="stats mono">
      <div><b id="stat-total">20</b> 張卡</div>
      <div><b>5</b> 位講者</div>
      <div><b>4</b> 類詞彙</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="mode-toggle">
      <button id="btn-daily" class="active">每日挑戰</button>
      <button id="btn-feed">滑卡</button>
      <button id="btn-browse">整理瀏覽</button>
      <button id="btn-quiz">測驗</button>
    </div>
    <div id="filters">
      <div class="filter-row">
        <span class="label">類別</span>

const state = { cats: new Set(), speakers: new Set(), mode: "feed" };

function buildChips(){
  const catChips = document.getElementById("cat-chips");
  Object.entries(CATS).forEach(([key,label])=>{
    const chip = document.createElement("span");
    chip.className = "chip"; chip.textContent = label; chip.dataset.key = key;
    chip.addEventListener("click", ()=>{
      state.cats.has(key) ? state.cats.delete(key) : state.cats.add(key);
      chip.classList.toggle("active");
      renderBrowse(); resetQuiz();
    });
    catChips.appendChild(chip);
  });
  const spChips = document.getElementById("speaker-chips");
  Object.entries(SPEAKERS).forEach(([key,s])=>{
    const chip = document.createElement("span");
    chip.className = "chip"; chip.dataset.key = key;
    chip.innerHTML = '<span class="dot" style="background:'+s.color+'"></span>'+s.short;
    chip.addEventListener("click", ()=>{
      state.speakers.has(key) ? state.speakers.delete(key) : state.speakers.add(key);
      chip.classList.toggle("active");
      renderBrowse(); resetQuiz();
    });
    spChips.appendChild(chip);
  });
}

function filteredCards(){
  return CARDS.filter(c=>{
    const catOk = state.cats.size === 0 || state.cats.has(c.cat);
    const spOk = state.speakers.size === 0 || state.speakers.has(c.speaker);
    return catOk && spOk;
  });
}

/* ---- Card faces: 1) term  2) definition + quote  3) source & context ---- */
function faceContentFor(c, which){
  const s = SPEAKERS[c.speaker];
  if (which === 0){
    return `
      <div class="face-top">
        <span class="cat-tag">${CATS[c.cat]}</span>
        <span class="rarity-badge ${c.rarity}" title="${RARITY[c.rarity].zh}">${RARITY[c.rarity].label}</span>
      </div>
      <span class="term-zh">${c.zh}</span>
      <div class="term-en">${c.term}</div>
      <div class="speaker-row"><span class="speaker-dot" style="background:${s.color}"></span>${s.name} · ${c.event}</div>
      <span class="hint">1 / 3 · 點擊看解釋</span>
    `;
  }
  if (which === 1){
    return `
      <span class="cat-tag">${CATS[c.cat]}</span>
      <div class="def-en">${c.def_en}</div>
      <div class="def-zh">${c.def_zh}</div>
      <blockquote class="quote">"${c.quote}"<cite>— ${s.name}, ${c.event}, ${c.date}</cite></blockquote>
      <span class="hint">2 / 3 · 點擊看出處</span>
    `;
  }
  return `
    <span class="cat-tag">出處與延伸</span>
    <div class="ext-block">
      <div class="ext-row"><span class="ext-label mono">講者</span><span>${s.name}（${s.short}）</span></div>
      <div class="ext-row"><span class="ext-label mono">場合</span><span>${c.event}</span></div>
      <div class="ext-row"><span class="ext-label mono">日期</span><span>${c.date}</span></div>
      <p class="ext-context">${c.context}</p>
    </div>
    <span class="hint">3 / 3 · 點擊回正面</span>
  `;
}

function initCardFaces(cardEl, c){
  cardEl.querySelector(".face.front").innerHTML = faceContentFor(c, 0);
  cardEl.querySelector(".face.back").innerHTML = faceContentFor(c, 1);
  cardEl.dataset.state = "0";
  cardEl.classList.remove("flipped");
}

function advanceCard(cardEl, c){
  const state = Number(cardEl.dataset.state || "0");
  const nextState = (state + 1) % 3;
  const flipped = cardEl.classList.toggle("flipped");
  const hiddenFace = flipped ? cardEl.querySelector(".face.front") : cardEl.querySelector(".face.back");
  const followingState = (nextState + 1) % 3;
  hiddenFace.innerHTML = faceContentFor(c, followingState);
  cardEl.dataset.state = String(nextState);
}

function buildFlashcardEl(c){
  const el = document.createElement("div");
  el.className = "flashcard rarity-" + c.rarity;
  el.dataset.id = c.id;
  el.innerHTML = (c.tag ? `<span class="special-badge">${c.tag}</span>` : "") +
    '<div class="flashcard-inner"><div class="face front"></div><div class="face back"></div></div>';
  initCardFaces(el, c);
  el.addEventListener("click", ()=> advanceCard(el, c));
  return el;
}

  CARDS.forEach((c, i)=>{
    const slide = document.createElement("div");
    slide.className = "feed-slide";
    slide.dataset.index = i;

    const counter = document.createElement("div");
    counter.className = "feed-counter mono";
    counter.textContent = (i+1) + " / " + CARDS.length;

    const wrap = document.createElement("div");
    wrap.className = "feed-card-wrap";
    wrap.appendChild(buildFlashcardEl(c));

    const shareBtn = document.createElement("button");
    shareBtn.className = "share-btn mono";
    shareBtn.textContent = "↗ 分享";
    shareBtn.addEventListener("click", (e)=>{ e.stopPropagation(); shareCard(c.id); });

    const hint = document.createElement("div");
    hint.className = "feed-hint mono";
    hint.textContent = "點卡片翻面・上滑看下一張";

    slide.append(counter, wrap, shareBtn, hint);
    scroll.appendChild(slide);
  });

  setupFeedObserver();
}

let feedObserver;
function setupFeedObserver(){
  const scrollEl = document.getElementById("feed-scroll");
  if (feedObserver) feedObserver.disconnect();
  feedObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if (entry.isIntersecting && entry.intersectionRatio > 0.5){
        const idx = Number(entry.target.dataset.index);
        document.getElementById("feed-progress-bar").style.width = ((idx+1) / CARDS.length * 100) + "%";
      }
    });
  }, { root: scrollEl, threshold: [0.5, 0.6, 0.75] });
  scrollEl.querySelectorAll(".feed-slide").forEach(el=> feedObserver.observe(el));
}

function scrollFeedToCard(id){
  const el = document.querySelector('.feed-slide .flashcard[data-id="'+id+'"]');
  if (el) el.closest(".feed-slide").scrollIntoView({ block: "start" });
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove("show"), 1800);
}

function shareCard(id){
  const c = CARDS.find(x=> x.id === id);
  if (!c) return;
  const url = location.origin + location.pathname + "#card-" + id;
  const text = c.term + "（" + c.zh + "） — " + c.def_zh;
  if (navigator.share){
    navigator.share({ title: "Keynote Lexicon", text, url }).catch(()=>{});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(url).then(
      ()=> showToast("連結已複製"),
      ()=> showToast("複製失敗，請手動複製網址")
    );
  } else {
    showToast(url);
  }
}

/* ---- Browse grid ---- */
function renderBrowse(){
  const grid = document.getElementById("browse-grid");
  grid.innerHTML = "";
  const cards = filteredCards();
  if (cards.length === 0){
    grid.innerHTML = '<p class="mono" style="color:var(--muted); grid-column:1/-1;">沒有符合篩選條件的卡片。</p>';

  cards.forEach(c=> grid.appendChild(buildFlashcardEl(c)));

/* ---- Quiz mode ---- */
let quizDeck = [];
let quizIndex = 0;
let quizResults = {};
let known = {};
try { known = JSON.parse(localStorage.getItem("keynote-lexicon-known") || "{}"); } catch(e){ known = {}; }

function resetQuiz(){
  quizDeck = filteredCards().slice().sort(()=>Math.random()-0.5);
  quizIndex = 0; quizResults = {};
  document.getElementById("quiz-done").style.display = "none";
  document.getElementById("quiz-card-holder").style.display = "";
  document.querySelector(".quiz-hint").style.display = "";
  document.querySelector(".quiz-actions").style.display = "";
  renderQuizCard();
}

function renderQuizCard(){
  const bar = document.getElementById("quiz-progress-bar");
  const counter = document.getElementById("quiz-counter");
  const holder = document.getElementById("quiz-card-holder");
  if (quizDeck.length === 0){
    counter.textContent = "0 / 0";
    bar.style.width = "0%";
    holder.innerHTML = '<p class="mono" style="color:var(--muted);">沒有符合篩選條件的卡片。</p>';
    return;
  }
  if (quizIndex >= quizDeck.length){
    showQuizDone();
    return;
  }
  bar.style.width = (quizIndex / quizDeck.length * 100) + "%";
  counter.textContent = (quizIndex+1) + " / " + quizDeck.length;
  const c = quizDeck[quizIndex];
  holder.innerHTML = "";
  holder.appendChild(buildFlashcardEl(c));
}

function showQuizDone(){
  document.getElementById("quiz-card-holder").style.display = "none";
  document.querySelector(".quiz-hint").style.display = "none";
  document.querySelector(".quiz-actions").style.display = "none";
  document.getElementById("quiz-progress-bar").style.width = "100%";
  document.getElementById("quiz-counter").textContent = quizDeck.length + " / " + quizDeck.length;
  const knownCount = Object.values(quizResults).filter(Boolean).length;
  const done = document.getElementById("quiz-done");
  done.style.display = "block";
  done.querySelector("h2").textContent = knownCount + " / " + quizDeck.length + " 認識";
  done.querySelector("p").textContent = knownCount === quizDeck.length
    ? "全部認識，這批詞彙可以換更多講者或類別繼續挑戰。"
    : "還不熟的詞彙已標記，下次可以針對它們加強複習。";
}

function markQuiz(isKnown){
  if (quizIndex >= quizDeck.length) return;
  const c = quizDeck[quizIndex];
  quizResults[c.id] = isKnown;
  known[c.id] = isKnown;
  try { localStorage.setItem("keynote-lexicon-known", JSON.stringify(known)); } catch(e){}
  quizIndex++;
  renderQuizCard();
}

document.getElementById("btn-know").addEventListener("click", ()=> markQuiz(true));
document.getElementById("btn-dontknow").addEventListener("click", ()=> markQuiz(false));
document.getElementById("quiz-restart").addEventListener("click", resetQuiz);

document.addEventListener("keydown", (e)=>{
  if (state.mode !== "quiz") return;
  if (e.code === "Space"){
    e.preventDefault();
    const el = document.querySelector("#quiz-card-holder .flashcard");
    if (el) el.click();
  }
  if (e.code === "ArrowRight"){ markQuiz(true); }
  if (e.code === "ArrowLeft"){ markQuiz(false); }
});

/* ---- Daily challenge: date-seeded pack of 3 + streak calendar ---- */
const DAILY_SIZE = 3;

function hashStr(str){
  let h = 0;
  for (let i = 0; i < str.length; i++){ h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayStr(d){
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + day;
}
function pickDailyCards(dateStr){
  const rng = mulberry32(hashStr(dateStr));
  const idx = CARDS.map((_, i)=> i);
  for (let i = idx.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i+1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx.slice(0, DAILY_SIZE).map(i=> CARDS[i]);
}

let dailyRecord = {};
try { dailyRecord = JSON.parse(localStorage.getItem("keynote-lexicon-daily") || "{}"); } catch(e){ dailyRecord = {}; }
let dailyOpened = {};
try { dailyOpened = JSON.parse(localStorage.getItem("keynote-lexicon-daily-opened") || "{}"); } catch(e){ dailyOpened = {}; }

function computeStreak(record){
  let streak = 0;
  const d = new Date();
  if (!record[todayStr(d)]) d.setDate(d.getDate() - 1);
  while (record[todayStr(d)]){ streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function updateStreakUI(){
  document.getElementById("streak-count").textContent = computeStreak(dailyRecord);
}
function updateDailyProgressUI(openedCount, total){
  document.getElementById("daily-progress-text").textContent = openedCount + " / " + total;
  document.getElementById("daily-progress-bar").style.width = (openedCount / total * 100) + "%";
}
function showDailyComplete(dateStr){
  const panel = document.getElementById("daily-complete");
  document.getElementById("daily-complete-sub").textContent = "已經連續 " + computeStreak(dailyRecord) + " 天完成挑戰。";
  panel.hidden = false;
}
function hideDailyComplete(){
  document.getElementById("daily-complete").hidden = true;
}
function completeDaily(dateStr){
  if (dailyRecord[dateStr]) return;
  dailyRecord[dateStr] = true;
  try { localStorage.setItem("keynote-lexicon-daily", JSON.stringify(dailyRecord)); } catch(e){}
  updateStreakUI();
  renderCalendar();
  showDailyComplete(dateStr);
}

function openPack(cover, cardEl, c, dateStr, total, shareBtn){
  cover.classList.add("opening");
  setTimeout(()=>{
    cover.remove();
    shareBtn.hidden = false;
    if (c.rarity === "legendary"){
      const burst = document.createElement("div");
      burst.className = "reveal-burst";
      cardEl.appendChild(burst);
      setTimeout(()=> burst.remove(), 850);
    }
    if (!dailyOpened[dateStr]) dailyOpened[dateStr] = [];
    if (!dailyOpened[dateStr].includes(c.id)) dailyOpened[dateStr].push(c.id);
    try { localStorage.setItem("keynote-lexicon-daily-opened", JSON.stringify(dailyOpened)); } catch(e){}
    const openedCount = dailyOpened[dateStr].length;
    updateDailyProgressUI(openedCount, total);
    if (openedCount >= total) completeDaily(dateStr);
  }, 520);
}

function renderDaily(){
  const dateStr = todayStr();
  const cards = pickDailyCards(dateStr);
  const openedIds = dailyOpened[dateStr] || [];
  const scroll = document.getElementById("daily-scroll");
  scroll.innerHTML = "";

  cards.forEach((c, i)=>{
    const isOpen = openedIds.includes(c.id);
    const slide = document.createElement("div");
    slide.className = "feed-slide";
    slide.dataset.index = i;

    const counter = document.createElement("div");
    counter.className = "feed-counter mono";
    counter.textContent = (i+1) + " / " + cards.length;

    const wrap = document.createElement("div");
    wrap.className = "feed-card-wrap";
    const cardEl = buildFlashcardEl(c);
    wrap.appendChild(cardEl);

    const shareBtn = document.createElement("button");
    shareBtn.className = "share-btn mono";
    shareBtn.textContent = "↗ 分享";
    shareBtn.hidden = !isOpen;
    shareBtn.addEventListener("click", (e)=>{ e.stopPropagation(); shareCard(c.id); });

    const hint = document.createElement("div");
    hint.className = "feed-hint mono";
    hint.textContent = "點卡片翻面・上滑看下一張";

    slide.append(counter, wrap, shareBtn, hint);
    scroll.appendChild(slide);

    if (!isOpen){
      const cover = document.createElement("div");
      cover.className = "pack-cover";
      cover.innerHTML = '<div class="pack-mark">KL</div><div class="pack-hint mono">點擊開卡</div>';
      cover.addEventListener("click", (e)=>{
        e.stopPropagation();
        openPack(cover, cardEl, c, dateStr, cards.length, shareBtn);
      });
      cardEl.appendChild(cover);
    }
  });

  scroll.scrollTop = 0;
  updateDailyProgressUI(openedIds.length, cards.length);
  if (dailyRecord[dateStr]) showDailyComplete(dateStr); else hideDailyComplete();
  updateStreakUI();
  renderCalendar();
}

let calViewDate = new Date();
function renderCalendar(){
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  document.getElementById("cal-month-label").textContent = y + " / " + String(m+1).padStart(2,"0");
  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";
  ["日","一","二","三","四","五","六"].forEach(d=>{
    const el = document.createElement("div");
    el.className = "cal-dow"; el.textContent = d;
    grid.appendChild(el);
  });
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  for (let i = 0; i < firstDow; i++){
    const el = document.createElement("div");
    el.className = "cal-cell empty";
    grid.appendChild(el);
  }
  const todayS = todayStr();
  for (let day = 1; day <= daysInMonth; day++){
    const dateStr = y + "-" + String(m+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
    const el = document.createElement("div");
    el.className = "cal-cell" + (dailyRecord[dateStr] ? " done" : "") + (dateStr === todayS ? " today" : "");
    el.textContent = dailyRecord[dateStr] ? "✓" : String(day);
    grid.appendChild(el);
  }
}

document.getElementById("cal-prev").addEventListener("click", ()=>{ calViewDate.setMonth(calViewDate.getMonth()-1); renderCalendar(); });
document.getElementById("cal-next").addEventListener("click", ()=>{ calViewDate.setMonth(calViewDate.getMonth()+1); renderCalendar(); });
document.getElementById("btn-toggle-calendar").addEventListener("click", ()=>{
  const wrap = document.getElementById("calendar-wrap");
  wrap.hidden = !wrap.hidden;
});
document.getElementById("btn-see-all").addEventListener("click", ()=> setMode("feed"));

function setMode(mode){
  state.mode = mode;
  document.getElementById("btn-daily").classList.toggle("active", mode === "daily");
  document.getElementById("btn-feed").classList.toggle("active", mode === "feed");
  document.getElementById("btn-browse").classList.toggle("active", mode === "browse");
  document.getElementById("btn-quiz").classList.toggle("active", mode === "quiz");
  document.getElementById("daily-panel").classList.toggle("active", mode === "daily");
  document.getElementById("feed-panel").classList.toggle("active", mode === "feed");
  document.getElementById("browse-grid").classList.toggle("active", mode === "browse");
  document.getElementById("quiz-panel").classList.toggle("active", mode === "quiz");
  document.getElementById("filters").style.display = (mode === "browse" || mode === "quiz") ? "flex" : "none";
  if (mode === "quiz") resetQuiz();
}

document.getElementById("btn-daily").addEventListener("click", ()=> setMode("daily"));
document.getElementById("btn-feed").addEventListener("click", ()=> setMode("feed"));
document.getElementById("btn-browse").addEventListener("click", ()=> setMode("browse"));
document.getElementById("btn-quiz").addEventListener("click", ()=> setMode("quiz"));

function resetFeedScroll(){
  const scrollEl = document.getElementById("feed-scroll");
  const hashMatch = location.hash.match(/^#card-(\d+)$/);
  if (hashMatch){
    scrollFeedToCard(Number(hashMatch[1]));
  } else if (scrollEl){
    scrollEl.scrollTop = 0;
  }
}

buildChips();
renderFeed();
renderBrowse();
renderDaily();

const hashMatch = location.hash.match(/^#card-(\d+)$/);
if (hashMatch){
  setMode("feed");
  requestAnimationFrame(resetFeedScroll);
} else {
  setMode("daily");
}

/* Browsers can restore a page's previous scroll position (bfcache back/forward,
   some mobile "recent tabs" restores) — without this, reopening the same link
   can land on whatever card was last viewed instead of the first one. */
window.addEventListener("pageshow", ()=>{
  requestAnimationFrame(()=>{ if (state.mode === "feed") resetFeedScroll(); });
});
</script>
